# Alembic configuration for the Kosmo backend.
# The database URL is resolved from application settings (KOSMO_DATABASE_URL)
# inside alembic/env.py; nothing sensitive is committed here.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden by env.py; kept empty to avoid duplicating configuration.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
